name: Build Speed Dreams R36S (ARM64 / PortMaster)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Build in ARM64 Docker Container
        run: |
          docker run --rm --privileged \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:20.04 /bin/bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential cmake git zip \
                libsdl2-dev libsdl2-image-dev \
                libopenal-dev libvorbis-dev libogg-dev \
                libenet-dev libxerces-c-dev \
                libjpeg-dev libpng-dev libz-dev \
                libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev \
                libopenscenegraph-dev \
                libexpat1-dev \
                libplib-dev

              # Fix für OsgAtomic.h
              ATOMIC_FILE=\"src/modules/graphic/osggraph/Utils/OsgAtomic.h\"
              if [ -f \"\$ATOMIC_FILE\" ]; then
                sed -i 's/--value;/--value; return value;/' \$ATOMIC_FILE || true
                sed -i 's/return ;/return value;/' \$ATOMIC_FILE || true
              fi

              export CFLAGS='-mcpu=cortex-a35+crypto+fp16 -mtune=cortex-a35 -march=armv8-a+crc+simd -O3 -ffast-math -fpermissive -w'
              export CXXFLAGS='-mcpu=cortex-a35+crypto+fp16 -mtune=cortex-a35 -march=armv8-a+crc+simd -O3 -ffast-math -fpermissive -w'
              export LDFLAGS='-lGL -lpthread -ldl'
              
              mkdir -p build && cd build

              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/workspace/dist/ports/speed-dreams \
                -DOPTION_BUILD_SIMU=ON

              # VERBOSE=1 druckt alle Befehle ab, um den Fehler exakt zu entlarven
              make VERBOSE=1 -j4
              make install

              find /workspace/dist/ports/speed-dreams -type f -exec strip --strip-unneeded {} + 2>/dev/null || true

              mkdir -p /workspace/dist/ports/speed-dreams/lib
              cp -P /usr/lib/aarch64-linux-gnu/libenet.so* /workspace/dist/ports/speed-dreams/lib/ 2>/dev/null || true
              cp -P /usr/lib/aarch64-linux-gnu/libxerces-c*.so* /workspace/dist/ports/speed-dreams/lib/ 2>/dev/null || true
              cp -P /usr/lib/aarch64-linux-gnu/libosg*.so* /workspace/dist/ports/speed-dreams/lib/ 2>/dev/null || true
              cp -P /usr/lib/aarch64-linux-gnu/libOpenThreads*.so* /workspace/dist/ports/speed-dreams/lib/ 2>/dev/null || true
              cp -P /usr/lib/aarch64-linux-gnu/libexpat.so* /workspace/dist/ports/speed-dreams/lib/ 2>/dev/null || true
          "

      - name: Auto-Generate PortMaster Scripts & Mapping
        run: |
          mkdir -p dist/ports/speed-dreams

          cat << 'EOF' > dist/speed-dreams.sh
          #!/bin/bash
          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi
          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"
          GAMEDIR="/$directory/ports/speed-dreams"
          cd "$GAMEDIR"
          export LD_LIBRARY_PATH="$GAMEDIR/lib:$LD_LIBRARY_PATH"
          export SD_DATADIR="$GAMEDIR/share/games/speed-dreams-2"
          export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"
          export SDL_AUDIODRIVER="alsa"
          export LIBGL_ES=2
          export LIBGL_GL=21
          export LIBGL_FB=4
          if [ -f "/usr/lib/libgl4es.so" ]; then
              export LD_PRELOAD="/usr/lib/libgl4es.so"
          fi
          export HOME="$GAMEDIR"
          export XDG_CONFIG_HOME="$GAMEDIR/conf"
          mkdir -p "$XDG_CONFIG_HOME/speed-dreams-2/settings"
          if [ ! -f "$XDG_CONFIG_HOME/speed-dreams-2/settings/screen.xml" ]; then
            cat << 'CFG_EOF' > "$XDG_CONFIG_HOME/speed-dreams-2/settings/screen.xml"
          <?xml version="1.0" encoding="UTF-8"?>
          <params>
            <section name="Screen">
              <attnum name="width" val="640"/>
              <attnum name="height" val="480"/>
              <attnum name="depth" val="16"/>
              <attstr name="window mode" val="fullscreen"/>
            </section>
          </params>
          CFG_EOF
          fi
          $ESUDO chmod 666 /dev/tty0
          $ESUDO chmod 666 /dev/tty1
          printf "\033c" > /dev/tty1
          printf "\033c" > /dev/tty0
          $GPTOKEYB "speed-dreams" -c "./speed-dreams.gptk" &
          ./bin/speed-dreams 2>&1 | tee log.txt
          $ESUDO kill -9 $(pidof gptokeyb)
          $ESUDO systemctl restart oga_events &
          printf "\033c" > /dev/tty1
          EOF
          chmod +x dist/speed-dreams.sh

          cat << 'EOF' > dist/ports/speed-dreams/speed-dreams.gptk
          back = esc
          start = enter
          a = up
          b = down
          x = space
          y = c
          l1 = v
          r1 = b
          up = up
          down = down
          left = left
          right = right
          left_analog_up = up
          left_analog_down = down
          left_analog_left = left
          left_analog_right = right
          EOF

      - name: Package Artifacts into ZIP
        run: |
          cd dist
          zip -r ../speed-dreams-r36s.zip speed-dreams.sh ports/

      - name: Upload PortMaster ZIP File
        uses: actions/upload-artifact@v4
        with:
          name: speed-dreams-r36s
          path: speed-dreams-r36s.zip

name: Build Speed Dreams R36S (ARM64 / PortMaster)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 1. QEMU zwingend installieren, damit ARM64 simuliert werden kann
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      # 2. Build im Docker-Container (mit explizitem Platform-Tag)
      - name: Build in ARM64 Docker Container
        run: |
          docker run --rm --privileged \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:20.04 /bin/bash -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential cmake git zip \
                libsdl2-dev libsdl2-image-dev \
                libopenal-dev libvorbis-dev libogg-dev \
                libenet-dev libxerces-c-dev \
                libjpeg-dev libpng-dev libz-dev \
                libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev

              # R36S (RK3326) spezifische Compiler-Flags
              export CFLAGS='-mcpu=cortex-a35+crypto+fp16 -mtune=cortex-a35 -march=armv8-a+crc+simd -O3 -ffast-math -flto'
              export CXXFLAGS='-mcpu=cortex-a35+crypto+fp16 -mtune=cortex-a35 -march=armv8-a+crc+simd -O3 -ffast-math -flto'
              
              mkdir -p build && cd build

              # CMake: Wir kompilieren gegen Standard OpenGL, da wir zur Laufzeit GL4ES nutzen
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/workspace/dist/ports/speed-dreams \
                -DOPTION_BUILD_SIMU=ON

              make -j\$(nproc)
              make install

              # Binaries strippen um Platz zu sparen
              find /workspace/dist/ports/speed-dreams -type f -exec strip --strip-unneeded {} + 2>/dev/null || true
          "

      # 3. PortMaster Scripte und Konfigurationen generieren
      - name: Create PortMaster Scripts & Mapping
        run: |
          mkdir -p dist/ports/speed-dreams
          
          # Kopiere das Startscript aus dem Repo (legen wir gleich an)
          cp portmaster_files/speed-dreams.sh dist/
          cp portmaster_files/speed-dreams.gptk dist/ports/speed-dreams/

      # 4. ZIP-Archiv erstellen
      - name: Package Artifacts into ZIP
        run: |
          cd dist
          zip -r ../speed-dreams-r36s.zip speed-dreams.sh ports/

      - name: Upload PortMaster ZIP File
        uses: actions/upload-artifact@v4
        with:
          name: speed-dreams-r36s
          path: speed-dreams-r36s.zip

name: Build Speed Dreams Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-port:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Verzeichnisse erstellen
        run: |
          mkdir -p dist/ports/speed-dreams

      - name: Ausführungsrechte vergeben und Skript starten
        run: |
          chmod +x dist/speed-dreams.sh
          ./dist/speed-dreams.sh

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: speed-dreams-r36s
          path: dist/
